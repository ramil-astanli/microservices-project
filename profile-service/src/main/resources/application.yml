server:
  port: 8081

spring:
  application:
    name: profile-service

  datasource:
    url: jdbc:postgresql://localhost:5435/profile_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true